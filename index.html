const DB_NAME='roadbook-auth-v1',STORE='keys',KEY_ID='v10-pbkdf2-v1',TTL=12*60*60*1000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(KEY_ID);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function dbPut(key){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:KEY_ID,key,expires:Date.now()+TTL});tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbDelete(){const db=await openDB();return new Promise(resolve=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(KEY_ID);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();resolve()}})}
async function decrypt(key){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.nonce)},key,b64(DATA.cipher));return new TextDecoder().decode(plain)}
function render(page){const lock=`<button id="roadbook-lock-device" title="清除本设备12小时免输" style="position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9999;width:auto;height:36px;margin:0;padding:0 12px;border:1px solid #ffffff38;border-radius:99px;background:#102532e8;color:#d6e7eb;font:700 11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;box-shadow:0 5px 18px #0004">锁定此设备</button><script>document.getElementById('roadbook-lock-device').onclick=()=>{const r=indexedDB.deleteDatabase('roadbook-auth-v1');r.onsuccess=r.onerror=r.onblocked=()=>setTimeout(()=>location.reload(),120)}<\/script>`;page=page.includes('</body>')?page.replace('</body>',lock+'</body>'):page+lock;document.open();document.write(page);document.close()}
async function derive(pass){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(){const btn=document.getElementById('open'),err=document.getElementById('error'),pass=document.getElementById('pass').value.trim();if(!pass){err.textContent='请输入访问口令';return}btn.disabled=true;btn.textContent='正在解密…';err.textContent='';try{const key=await derive(pass),page=await decrypt(key);if(document.getElementById('remember').checked){try{await dbPut(key)}catch(e){console.warn('12小时免输保存失败',e)}}else{await dbDelete()}render(page)}catch(e){err.textContent='口令不正确';btn.disabled=false;btn.textContent='解锁路书'}}
async function boot(){const btn=document.getElementById('open'),err=document.getElementById('error');try{const saved=await dbGet();if(saved&&saved.expires>Date.now()){btn.disabled=true;btn.textContent='正在自动解锁…';try{return render(await decrypt(saved.key))}catch(e){await dbDelete()}}else if(saved){await dbDelete()}}catch(e){console.warn('免输状态不可用',e)}btn.disabled=false;btn.textContent='解锁路书';document.getElementById('pass').focus()}
document.getElementById('open').onclick=unlock;document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});boot();
</script></body></html>
